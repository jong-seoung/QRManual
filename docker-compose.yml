# 루트 docker-compose.yml
# - 운영: 5종 (nginx + front + back + postgres + redis)
# - dev: docker-compose.override.yml에서 nginx/front/back을 비활성화하고 DB·Redis만 호스트 노출
# 옛 Backend/docker-compose.yml은 마이그레이션이 끝나면 제거.

services:
  nginx:
    image: nginx:alpine
    container_name: qrmanual-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - front
      - back
    restart: unless-stopped

  front:
    container_name: qrmanual-front
    build:
      context: ./front
      dockerfile: Dockerfile
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    depends_on:
      - back
    restart: unless-stopped

  back:
    container_name: qrmanual-back
    build:
      context: ./back
      dockerfile: Dockerfile
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: qrmanual-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: qrmanual-redis
    env_file:
      - .env
    restart: unless-stopped

volumes:
  postgres_data:
